{{define "flash"}}

{{if .Flash}}

<div class="container mt-3">

    <div id="flashMessage"
         class="alert alert-{{.Flash.Type}} alert-dismissible fade show"
         role="alert"
         data-flash-duration="{{.Flash.Duration}}">

        {{.Flash.Message}}

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert">
        </button>

    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const flash = document.getElementById("flashMessage");

        if (!flash) {
            return;
        }

        const duration = Number(
            flash.dataset.flashDuration
        );

        setTimeout(function() {
            const alert = bootstrap.Alert.getOrCreateInstance(flash);
            alert.close();
        }, duration);
    });
</script>

{{end}}

{{end}}
