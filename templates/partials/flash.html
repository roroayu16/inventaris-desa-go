{{define "flash"}}

{{if .Flash}}

<div class="container mt-3">

    <div id="flashMessage"
         class="alert alert-{{.Flash.Type}} alert-dismissible fade show"
         role="alert"
         data-flash-duration="{{.Flash.Duration}}"
         data-redirect-url="{{.Flash.RedirectURL}}">

        {{.Flash.Message}}

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert">
        </button>

    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const flash = document.getElementById("flashMessage");

        if (!flash) {
            return;
        }

        const duration = Number(
            flash.dataset.flashDuration
        );

        const redirectURL = flash.dataset.redirectUrl;

        setTimeout(function() {
            const alert = bootstrap.Alert.getOrCreateInstance(flash);
            alert.close();

            const redirectURL = flash.dataset.redirectUrl;

            setTimeout(function() {
                if (redirectURL) {
                    window.location.href = redirectURL;
                } else {
                    window.location.reload();
                }
            }, 300);
        }, duration);
    });
</script>

{{end}}

{{end}}
